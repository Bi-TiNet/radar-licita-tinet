name: Coleta Radar Licita

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-sync.yml'
      - 'app/**'
      - 'requirements.txt'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Enviar e-mail de teste para os dois destinatários cadastrados'
        type: boolean
        default: false
      discover_telegram:
        description: 'Enviar o ID em privado a cada pessoa que iniciou o bot'
        type: boolean
        default: false
      test_telegram:
        description: 'Enviar Telegram de teste aos dois destinatários cadastrados'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: radar-licita-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Install browser for collection
        if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.test_email || inputs.discover_telegram || inputs.test_telegram) }}
        run: |
          python -m playwright install --with-deps chromium
      - name: Collect opportunities
        if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.test_email || inputs.discover_telegram || inputs.test_telegram) }}
        env:
          SUPABASE_URL: https://bcjrwgnmwajvbidhnzuk.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.RADAR_SUPABASE_SECRET_KEY }}
          RADAR_NOTIFICATIONS_ENABLED: '1'
          RADAR_NOTIFICATION_CHANNELS: 'email,telegram'
          MIN_SCORE_NOTIFY: '40'
          SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_IDS }}
        run: python -m app.cloud_sync
      - name: Test email delivery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          RADAR_NOTIFICATION_CHANNELS: 'email'
          SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: python -m app.email_smoke
      - name: Send private Telegram chat IDs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
        run: python -m app.telegram_setup
      - name: Test Telegram delivery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          RADAR_NOTIFICATION_CHANNELS: 'telegram'
          TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_IDS }}
        run: python -m app.telegram_smoke
