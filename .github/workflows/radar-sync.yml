name: Coleta Radar Licita

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-licita-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect opportunities
        env:
          SUPABASE_URL: https://bcjrwgnmwajvbidhnzuk.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.RADAR_SUPABASE_SECRET_KEY }}
          RADAR_NOTIFICATIONS_ENABLED: '0'
          MIN_SCORE_NOTIFY: '40'
          SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.RADAR_SMTP_PORT }}
          SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.RADAR_SMTP_FROM }}
          EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          WHATSAPP_NUMBERS: ${{ secrets.RADAR_WHATSAPP_NUMBERS }}
          EVOLUTION_API_URL: ${{ secrets.RADAR_EVOLUTION_API_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.RADAR_EVOLUTION_INSTANCE }}
          EVOLUTION_API_KEY: ${{ secrets.RADAR_EVOLUTION_API_KEY }}
        run: python -m app.cloud_sync
